services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devmind
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind_password
    ports:
      - "5432:5432"
    volumes:
      - devmind-postgres-data:/var/lib/postgresql/data

volumes:
  devmind-postgres-data: